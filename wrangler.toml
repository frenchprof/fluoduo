# Cloudflare Pages config (Dan, 2026-07-10: enable Functions logs).
#
# DELIBERATELY MINIMAL: once this file exists it becomes the source of truth
# for the settings it declares, and those become read-only in the dashboard.
# It declares ONLY the build output dir (matching the dashboard value) and
# observability — so:
#   - SECRETS (ANTHROPIC_API_KEY, GOOGLE_TTS_API_KEY, …) stay managed in the
#     dashboard's Settings → Environment variables, as before. Never put
#     credentials in this file — it is committed to the repo.
#   - Build-time vars (NEXT_PUBLIC_…) stay in the dashboard build settings.
#
# Logs land in Workers & Pages → Observability (7-day retention), or stream
# live with `npx wrangler pages deployment tail` (needs a Cloudflare login).
name = "fluoguo"
pages_build_output_dir = "out"
compatibility_date = "2026-07-01"

[observability]
enabled = true

[observability.logs]
invocation_logs = true
head_sampling_rate = 1
