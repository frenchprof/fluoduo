<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#fbfaf4}section{width:1920px;height:1080px;box-sizing:border-box;position:relative;overflow:hidden}section *{margin:0}aside{display:none}table{border-collapse:collapse;width:100%}td,th{padding:10px 16px;border-bottom:1px solid #ddd;text-align:left}x-shape{display:block}x-shape[kind=arrow-right]{clip-path:polygon(0 30%,60% 30%,60% 0,100% 50%,60% 100%,60% 70%,0 70%)}</style><style>@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes card{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
#status>div:first-child{clip-path:inset(0 100% 0 0)}
.go #status>div:first-child{animation:wipe .9s ease-in-out .1s forwards}
#status .C,#status .M,#status .K{opacity:0}
.go #status .C1{animation:card .6s ease-out .6s forwards}
.go #status .C2{animation:card .6s ease-out 2.7s forwards}
.go #status .M{animation:fade .7s ease-out 4.8s forwards}
.go #status .K{animation:fade .6s ease-out 5.6s forwards}
#status .C{position:relative}
.bar{position:absolute;left:40px;right:40px;bottom:16px;height:14px;border-radius:7px}
.b1{background:#3a4254}
.b1 i{position:absolute;inset:0;border-radius:7px;background:#1ca6ff;transform-origin:left;transform:scaleX(0)}
.go .b1 i{animation:fill .9s cubic-bezier(.4,0,.2,1) 1.3s forwards}
.b2{border:2px dashed #00c197;box-sizing:border-box;clip-path:inset(0 100% 0 0)}
.go .b2{animation:wipe 1.1s ease-in-out 3.3s forwards}
.lv{display:inline-block;margin-left:18px;vertical-align:middle;width:44px;height:44px;opacity:0}
.lv path{fill:none;stroke:#1ca6ff;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.go .lv{animation:pop .45s ease-out 2.2s forwards}
</style></head><body><section id="status" data-transition="fade" style="background:#1f2430;color:#f6f3e8;font-family:Roboto, Arial, sans-serif;padding:128px;display:flex;flex-direction:column;gap:40px">
<div style="position:absolute;left:0;top:0;width:1920px;height:24px;background:linear-gradient(90deg, #fcdf00 0%, #fcdf00 14%, #1ca6ff 14%, #1ca6ff 28%, #00c197 28%, #00c197 42%, #b17eff 42%, #b17eff 56%, #9398ff 56%, #9398ff 70%, #ff9037 70%, #ff9037 84%, #9ca3af 84%, #9ca3af 100%)"></div>
<p style="font-size:28px;color:#fcdf00;letter-spacing:3px;text-transform:uppercase;font-weight:700">Where it stands</p>
<h2 style="font-family:'Patrick Hand', 'Trebuchet MS', cursive;font-size:72px;font-weight:400;line-height:1.1;color:#f6f3e8;-webkit-text-stroke:2px #f6f3e8">Where it stands</h2>
<div style="display:flex;gap:40px">
<div style="flex:1;display:flex;flex-direction:column;gap:12px;background:#2b3242;padding:40px;border-radius:20px;border-top:12px solid #1ca6ff">
<p style="font-size:28px;color:#9ca3af;font-weight:700">FRENCH</p>
<p style="font-size:44px;line-height:1.2">Live</p>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:12px;background:#2b3242;padding:40px;border-radius:20px;border-top:12px solid #00c197">
<p style="font-size:28px;color:#9ca3af;font-weight:700">CHINESE</p>
<p style="font-size:44px;line-height:1.2">Designed. The build starts after the conference.</p>
</div>
</div>
<p style="font-family:'Patrick Hand', 'Trebuchet MS', cursive;font-size:80px;line-height:1.1;color:#fcdf00">Merci · 谢谢 · Thank you</p>
<p style="font-size:32px;color:#f6f3e8">Daniel Chan · NUS Centre for Language Studies · daniel.chan@nus.edu.sg</p>

</section>
<script>const s=document.getElementById('status'),cs=s.querySelectorAll(':scope>div:nth-of-type(2)>div');
cs[0].classList.add('C','C1');cs[1].classList.add('C','C2');
const ps=s.querySelectorAll(':scope>p');ps[1].classList.add('M');ps[2].classList.add('K');
cs[0].insertAdjacentHTML('beforeend','<div class="bar b1"><i></i></div>');
cs[1].insertAdjacentHTML('beforeend','<div class="bar b2"></div>');
cs[0].querySelectorAll('p')[1].insertAdjacentHTML('beforeend','<svg class="lv" viewBox="0 0 44 44"><path d="M8 23 L18 33 L37 11"/></svg>');
</script></body></html>
