<script>
window.SLIDE = function(){
  const $ = id => document.getElementById(id);
  const q = s => Array.from(document.querySelectorAll(s));
  // the line between the two goals draws on "between"
  const p = $('lk'), L = 160; p.style.strokeDasharray = L;
  A(p, [{strokeDashoffset:L},{strokeDashoffset:0}], CUE('3:between'), 0.6, 'both');
  // the cycle loops back after revision
  const lp = $('loop'), LL = lp.getTotalLength(); lp.style.strokeDasharray = LL;
  A(lp, [{strokeDashoffset:LL, opacity:0},{strokeDashoffset:LL, opacity:1, offset:.02},{strokeDashoffset:0, opacity:1}], CUE('4:revision')+0.3, 0.8, 'both');
  // each card lifts when it is named, then settles
  [['k1','2:explicit'],['k2','3:relationship'],['k3','4:cycle'],['k4','5:distinction']].forEach(([id,c]) =>
    A($(id), [{transform:'none'},{transform:'translateY(-12px)', boxShadow:'0 14px 30px rgba(0,113,90,.18)'},{transform:'none'}], CUE(c), 1.0, 'none'));
  // all four still to be tested: borders go dashed
  q('#n14 .card').forEach((el,i) => A(el, [{borderStyle:'solid'},{borderStyle:'dashed'}], CUE('6:tested')+i*0.1, 0.3, 'forwards'));
};
</script>
