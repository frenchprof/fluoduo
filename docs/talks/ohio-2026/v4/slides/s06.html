<style>
#s06 .dot{width:62px;height:62px;border-radius:50%;background:#fff;border:3px solid #9ca3af;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:500;color:#1f2430}

#s06 .card{left:0;width:500px;height:110px;border-radius:22px;border:4px solid;display:flex;align-items:center;gap:22px;padding:0 24px;font-size:36px;font-weight:500}
#s06 .card b{flex:none;width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;color:#1f2430}

#s06 .flag{top:0;width:130px;height:130px;border-radius:20px;background:#fff4ed;border:4px solid #ff9037;font-size:56px;display:flex;align-items:center;justify-content:center}
</style>
<script>
window.SLIDE = function(){
  const $ = id => document.getElementById(id);
  const map = $('map');
  const X = i => 140 + i*80, Y = r => 300 + r*120;
  // the five unit lines
  for (let r = 0; r < 5; r++){
    const ln = document.createElement('div');
    ln.className = 'abs';
    ln.style.cssText = `left:${X(0)+31}px;top:${Y(r)+29}px;width:${9*80}px;height:4px;background:#d7d9de;border-radius:2px`;
    map.appendChild(ln);
    A(ln, [{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0 0 0)'}], CUE('3:fifty') + r*0.35, 0.6);
  }
  const dots = {};
  for (let n = 1; n <= 50; n++){
    const r = Math.floor((n-1)/10), i = (n-1)%10;
    const d = document.createElement('div');
    d.className = 'dot abs'; d.textContent = n;
    d.style.left = X(i)+'px'; d.style.top = Y(r)+'px';
    map.appendChild(d); dots[n] = d;
    A(d, [{opacity:0,transform:'scale(.5)'},{opacity:1,transform:'none'}], CUE('3:fifty') + r*0.35 + i*0.04, 0.4);
  }
  // "fifty numbered goals in a row": a ripple along the stops
  for (let n = 1; n <= 50; n++)
    A(dots[n], [{transform:'none'},{transform:'translateY(-10px)'},{transform:'none'}], CUE('4:numbered') + (n-1)*0.03, 0.4, 'none');
  // the goal under the map pulses when the goals come first
  A($('exoG'), [{transform:'none'},{transform:'scale(1.2)'},{transform:'none'}], CUE('6:goal'), 0.6, 'none');
  // 28, 29, 30 light up in their colours
  const col = {28:['#1ca6ff','#eff8ff','8'], 29:['#fcdf00','#faf7e2','9'], 30:['#ff9037','#fff4ed','10']};
  for (const n of [28,29,30]){
    A(dots[n], [{borderColor:'#9ca3af',background:'#fff',borderWidth:'3px'},{borderColor:col[n][0],background:col[n][1],borderWidth:'6px'}], CUE(col[n][2]), 0.5, 'forwards');
    A(dots[n], [{transform:'none'},{transform:'scale(1.35)'},{transform:'none'}], CUE(col[n][2]), 0.7, 'none');
    // all three the same: one equal pulse together
    A(dots[n], [{transform:'none'},{transform:'scale(1.35)'},{transform:'none'},{transform:'scale(1.35)'},{transform:'none'}], CUE('11:same'), 1.4, 'none');
    // the map mixed three kinds
    A(dots[n], [{transform:'none'},{transform:'scale(1.35)'},{transform:'none'}], CUE('20:three'), 0.8, 'none');
  }
  // the other stops fade back as the right side takes over
  for (let n = 1; n <= 50; n++) if (![28,29,30].includes(n))
    A(dots[n], [{opacity:1},{opacity:.45}], CUE('21'), 0.6, 'forwards');
  // the email: a wall of many bricks
  const wall = $('wall');
  let k = 0;
  for (let r = 2; r >= 0; r--) for (let c = 0; c < 4 - (r%2 ? 1 : 0); c++){
    const b = document.createElement('div');
    b.className = 'brick abs';
    b.style.left = (c*64 + (r%2 ? 32 : 0))+'px'; b.style.top = (r*42)+'px';
    wall.appendChild(b);
    A(b, [{opacity:0,transform:'translateY(-30px)'},{opacity:1,transform:'none'}], CUE('14:many') + k*0.12, 0.45);
    k++;
  }
};
</script>
