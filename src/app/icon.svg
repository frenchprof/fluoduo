<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    The FluOLinGo mark at tab size: the notebook, its page, and the F.

    SIMPLIFIED ON PURPOSE. The full mark carries two more parts - the amber
    counter that closes the g, and the low band across the page. At 16px they
    are one pixel each and turn the middle of the tile to mud, so this variant
    drops them and the app icons in public/icons keep them. Apple ships two
    drawings of its own mark for the same reason.

    FLAT ON PURPOSE too: the App Store fade this mark borrows is invisible
    below about 48px, and a gradient at 16px only costs contrast.
  -->
  <rect width="100" height="100" rx="0" fill="#f5f2e8"/>
  <rect x="0" y="28" width="24" height="9" rx="2" fill="#f7c243"/>
  <rect x="0" y="48" width="24" height="9" rx="2" fill="#f7c243"/>
  <rect x="0" y="68" width="24" height="9" rx="2" fill="#f7c243"/>
  <rect x="27" y="13" width="71" height="85" rx="17" fill="#ff4eb2"/>
  <rect x="37" y="27" width="52" height="62" rx="3" fill="#2ea600"/>
  <path d="M37 27 H48 V52 H75 V64 H48 V68 H37 Z" fill="#5495ff"/>
</svg>
