<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <mask id="bite" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect x="0" y="0" width="100" height="100" fill="#fff"/>
      <rect x="1" y="16.6" width="27" height="10.8" rx="5.4" fill="#000"/>
      <rect x="1" y="33.6" width="27" height="10.8" rx="5.4" fill="#000"/>
      <rect x="1" y="50.6" width="27" height="10.8" rx="5.4" fill="#000"/>
      <rect x="1" y="67.6" width="27" height="10.8" rx="5.4" fill="#000"/>
    </mask>
    <clipPath id="pg"><rect x="16" y="8" width="76" height="84" rx="9"/></clipPath>
  </defs>
  <!-- No background plate (Dan, 5 Sep: the favicon "does not need the white
       background against the dark background" — the tab icon floats on
       whatever chrome the browser has). The OPAQUE ground lives on in
       apple-touch-icon and maskable-512 only, because iOS fills transparency
       with black and Android's maskable crop needs full bleed. -->
  <g transform="translate(0 0) scale(1)">
    <g mask="url(#bite)">
      <g clip-path="url(#pg)">
        <rect x="16" y="8" width="76" height="84" fill="#ff4eb2"/>
        <rect x="57" y="8" width="35" height="33" fill="#d7008e"/>
        <rect x="57" y="41" width="35" height="27" fill="#00b28b"/>
      </g>
    </g>
    <rect x="4" y="18.4" width="22" height="7.2" rx="3.6" fill="#009d7a"/>
    <rect x="4" y="35.4" width="22" height="7.2" rx="3.6" fill="#009d7a"/>
    <rect x="4" y="52.4" width="22" height="7.2" rx="3.6" fill="#009d7a"/>
    <rect x="4" y="69.4" width="22" height="7.2" rx="3.6" fill="#009d7a"/>
  </g>
</svg>