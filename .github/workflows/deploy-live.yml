# Deploy = mirror main to production (dckg/fluo), whose Cloudflare Pages
# project auto-builds its main.
#
# Dan, 2026-08-31, on how deploys should work: "we go through fluoduo main."
# So this is a MANUAL trigger, not a push mirror: fluoduo-main fires it as
# the last step of a QC round, and Dan can fire it from the Actions tab.
# Nothing deploys itself mid-lesson because a merge happened to land.
#
# Two refusals before the push, both cheap and both load-bearing:
#   - only main deploys — a branch dispatch is a mistake, not a request;
#   - only a commit whose `verify` check is GREEN deploys — the mirror must
#     never outrun CI, even if a human fires it in the minutes between a
#     merge and its verify run finishing.
#
# LIVE_DEPLOY_TOKEN is a fine-grained PAT: Contents read/write on dckg/fluo
# and nothing else (minted by Dan, 2026-09-01). Actions masks it in logs.
name: deploy-live

on:
  workflow_dispatch:

# The guard step reads the verify check's conclusion through the checks API,
# and the default GITHUB_TOKEN does not carry that scope unless declared —
# run 1 failed exactly there (403, "Resource not accessible by integration").
permissions:
  contents: read
  checks: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to deploy anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "deploy-live runs from main only (got ${{ github.ref }})"
          exit 1

      - uses: actions/checkout@v5
        with:
          # The mirror pushes real history, so it needs all of it.
          fetch-depth: 0

      - name: Refuse to deploy a commit verify has not passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?check_name=verify" \
            --jq '.check_runs[0].conclusion // "missing"')
          echo "verify on ${{ github.sha }}: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "verify is not green on this commit — not deploying"
            exit 1
          fi

      # Runs 2-7 all died on `remote: Repository not found`, which is one
      # message for THREE different faults: the secret is empty or missing on
      # THIS repo (an empty token pushes anonymously, and a private repo
      # answers 404 to strangers), the token is expired or malformed, or the
      # token is fine but was never granted dckg/fluo. This step names which,
      # without ever printing the token — Actions masks it, and `gh api user`
      # prints only the login it authenticates as.
      - name: Say exactly what the deploy token can see
        env:
          GH_TOKEN: ${{ secrets.LIVE_DEPLOY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::LIVE_DEPLOY_TOKEN is EMPTY. The secret must be a"
            echo "::error::Repository secret on frenchprof/fluoduo (Settings >"
            echo "::error::Secrets and variables > Actions) — the workflow runs"
            echo "::error::HERE, so a secret stored on dckg/fluo never reaches it."
            exit 1
          fi
          login=$(gh api user --jq .login 2>/dev/null || true)
          if [ -z "$login" ]; then
            echo "::error::The token authenticates as NOBODY — it is expired,"
            echo "::error::revoked, or was pasted with a stray character."
            exit 1
          fi
          echo "token authenticates as: $login"
          if ! gh api repos/dckg/fluo --jq .full_name 2>/dev/null; then
            echo "::error::The token is valid (it is $login) but CANNOT SEE"
            echo "::error::dckg/fluo. On its settings page check: Resource owner"
            echo "::error::is dckg, Repository access includes dckg/fluo, and"
            echo "::error::Contents is Read and write."
            exit 1
          fi
          echo "dckg/fluo is visible — pushing"

      - name: Mirror main to dckg/fluo
        run: |
          git push "https://x-access-token:${{ secrets.LIVE_DEPLOY_TOKEN }}@github.com/dckg/fluo.git" HEAD:main
