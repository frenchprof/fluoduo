# THIS WORKFLOW PUBLISHES A LIVE PUBLIC SITE. It is not a preview any more.
#
# It was written as one, and said so — "it is entirely separate from
# production", "IT DOES NOT TOUCH PRODUCTION". On 2026-08-12 a custom domain
# was added to this repository's Pages settings (the root CNAME file, commit
# 43b7d17), and GitHub Pages Settings now reports "Your site is live at
# https://fluolingo.com/". So every push to main deploys to a public domain,
# and https://frenchprof.github.io/fluoduo/ 301-redirects there rather than
# serving anything of its own.
#
# The stale comment was believed on 2026-09-02 and nearly cost the sign-in
# wall: an agent, asked for a viewable open build, proposed setting the
# open-app build flag (authConfig.ts names it) in the build step below, on
# the grounds that this was a throwaway preview. That would have taken the
# wall down for every visitor to fluolingo.com. verify38-authwall.py refused
# it — that flag is banned from every config a deploy reads, and this file is
# one. Note it cannot be named here either: verify38 greps this file raw, so
# even a comment mentioning it fails, which is deliberate.
#
# So: DO NOT open the wall here, and do not treat this file as a sandbox.
# An open build needs a host that is not this one.
#
# THE OTHER PRODUCTION PATH is deploy-live.yml, which mirrors main to
# dckg/fluo, built by Cloudflare Pages and served at
# fluolingo.withdrchan.com. Two live sites, both fed from main.
#
# WHAT WILL NOT WORK ON THE PREVIEW, by design:
#   /api/tutor, /api/tts, /api/correct, /api/compose
# Those are Cloudflare Pages Functions — real server-side code holding the API
# key. GitHub Pages has no server, so ChaTutor, text-to-speech and Compose's
# answer-checking will fail there. Everything else — decks, games, drills,
# /moi, /teacher — runs in the browser against Firebase and works normally.
#
# BEFORE THE FIRST RUN, one manual step (otherwise sign-in fails and /moi and
# /teacher show nothing):
#   Firebase console → Authentication → Settings → Authorised domains
#   → Add domain → frenchprof.github.io
name: Preview to GitHub Pages

on:
  workflow_dispatch:          # run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# One preview at a time; a newer push supersedes an in-flight build.
concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    # The preview exists only in the WORKING repo. The same commits get
    # pushed to dckg/fluo (production, built by Cloudflare), where GitHub
    # Pages is deliberately disabled — without this guard the workflow runs
    # there too and fails with a 404 on every deploy (seen 2026-08-21).
    # `deploy` needs `build`, so skipping this skips both.
    if: github.repository == 'frenchprof/fluoduo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export at the /fluoduo subpath
        env:
          PAGES_BASE_PATH: /fluoduo
        run: npm run build

      # Without this, GitHub Pages runs Jekyll, which strips any directory
      # beginning with an underscore — including _next/, i.e. every script and
      # stylesheet the app has.
      - run: touch out/.nojekyll

      # Pages has no server-side rewrites. Next's export writes out/404.html;
      # GitHub Pages serves it for unknown paths, which is what makes deep
      # links behave rather than showing GitHub's own 404.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
