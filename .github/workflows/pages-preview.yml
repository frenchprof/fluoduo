# THIS WORKFLOW PUBLISHES TO A DEPLOYMENT NOBODY CAN REACH — and that is a
# loaded gun, not a safe one. Read all of this before touching it.
#
# WHAT IT SAYS ABOUT ITSELF, AND WHY THAT WAS WRONG. The header used to read
# "it is entirely separate from production" and "IT DOES NOT TOUCH
# PRODUCTION". On 2026-08-12 a custom domain was added to this repository's
# Pages settings (root CNAME, commit 43b7d17), and GitHub Pages Settings now
# reports "Your site is live at https://fluolingo.com/". Read alone, that says
# this workflow deploys production.
#
# IT DOES NOT, and the evidence is specific. fluolingo.com serves a build with
# NO base path — https://fluolingo.com/fluoduo/ does not exist (Dan, 2 Sep),
# while the root loads. This workflow USED to build with
# PAGES_BASE_PATH=/fluoduo (dropped in #157, while the root-serving story was
# believed), so its assets lived under /fluoduo/_next/. The site being served is
# therefore the Cloudflare one: deploy-live.yml mirrors main to dckg/fluo,
# Cloudflare Pages builds it with no base path, and the fluolingo.com DNS
# record answers from Cloudflare. GitHub only knows what its own custom-domain
# setting says; nothing routes that hostname to it.
#
# So the artifact this workflow publishes is reachable at NO URL at all:
# frenchprof.github.io/fluoduo 301-redirects to fluolingo.com (because the
# custom domain is configured), and fluolingo.com is answered by Cloudflare.
#
# WHY IT IS STILL DANGEROUS. GitHub Pages holds a live claim on a production
# hostname. Point that DNS record at GitHub, or drop the Cloudflare record,
# and this artifact takes over fluolingo.com the same minute — with the wrong
# base path, and with whatever was built into it. Do not treat this file as a
# sandbox on the grounds that nobody can see its output today.
#
# In particular: DO NOT open the sign-in wall here. Asked on 2 Sep for a way
# to view the app signed out, a session read the old header, believed it, and
# proposed setting the open-app build flag (authConfig.ts names it) in the
# build step below. verify38-authwall.py refused it — that flag is banned from
# every config a deploy reads and this file is one. It cannot even be named
# here: verify38 greps this file raw, so a comment mentioning it fails too.
# That is deliberate.
#
# ── THAT FIX HAS BEEN DONE (between 2 and 5 Sep), so this header follows it ──
#
# Someone cleared the custom domain in Settings -> Pages. GitHub's own deploy
# log is the receipt: actions/deploy-pages prints the URL this artifact is
# really served at, on every single run.
#
#     2 Sep 08:27   Evaluated environment url: https://fluolingo.com/
#     5 Sep 02:22   Evaluated environment url: https://frenchprof.github.io/fluoduo/
#
# So this is a PROJECT SITE at a SUBPATH again: reachable, claiming no
# production hostname, and the phone preview it was written to be. Confirmed
# independently from outside — docs/STAGING.md, 4 Sep, having actually opened
# it: "its HTML asks for /_next/… at the github.io root (404); the files live
# under /fluoduo/_next/".
#
# WHICH IS WHY PAGES_BASE_PATH IS BACK BELOW. It was dropped in #157 on the
# then-correct reading that the artifact was served at fluolingo.com's root.
# The moment the domain was cleared that reading inverted, and the same build
# began emitting /_next/… for a site served at /fluoduo/ — the 17 Aug fault
# again, mirrored.
#
# THE STANDING RULE, third time of asking. Whether this needs a subpath is not
# a fact about the repository. It is a fact about a DASHBOARD SETTING nobody
# working here can see, and it has now been changed by hand twice without the
# build changing with it. So the workflow DECLARES the home it is building for,
# one line below, and verify91 holds the build to that declaration in both
# directions. When the setting changes, read the deploy log — the one source in
# reach that cannot be a stale comment — and change the declaration with it.
#
# WHAT DOES NOT WORK ON THIS HOST, by design:
#   /api/tutor, /api/tts, /api/correct, /api/compose
# Those are Cloudflare Pages Functions — real server-side code holding the API
# key. GitHub Pages has no server, so ChaTutor, text-to-speech and Compose's
# answer-checking fail HERE and work on the Cloudflare hosts.
#
# AND THIS IS NOT THE NO-LOGIN HOST (Dan, 5 Sep: "staging and fluoduo.pages.dev
# is meant for developer use (so no log in)"). The wall stays up here; the
# signed-out developer surface is a Cloudflare build with the open-app flag set
# in ITS dashboard, never in this repo. docs/STAGING.md is the recipe.
#
# BEFORE THE FIRST RUN, one manual step (otherwise sign-in fails and /moi and
# /teacher show nothing):
#   Firebase console → Authentication → Settings → Authorised domains
#   → Add domain → frenchprof.github.io
name: Preview to GitHub Pages

on:
  workflow_dispatch:          # run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# One preview at a time; a newer push supersedes an in-flight build.
concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    # The preview exists only in the WORKING repo. The same commits get
    # pushed to dckg/fluo (production, built by Cloudflare), where GitHub
    # Pages is deliberately disabled — without this guard the workflow runs
    # there too and fails with a 404 on every deploy (seen 2026-08-21).
    # `deploy` needs `build`, so skipping this skips both.
    if: github.repository == 'frenchprof/fluoduo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # THE DECLARATION, and the build that follows from it. PAGES_HOME is the
      # repo's written record of what the deploy log last said; PAGES_BASE_PATH
      # is what that record requires. verify91 checks the second against the
      # first, so the two cannot drift the way the build and the dashboard did
      # — twice.
      #
      #   subpath  ->  https://frenchprof.github.io/fluoduo/   needs /fluoduo
      #   root     ->  a custom domain, e.g. https://example.com/   needs none
      - name: Build the static export at the /fluoduo subpath
        env:
          PAGES_HOME: subpath        # from the deploy log, 5 Sep 02:22
          PAGES_BASE_PATH: /fluoduo
        run: npm run build

      # Without this, GitHub Pages runs Jekyll, which strips any directory
      # beginning with an underscore — including _next/, i.e. every script and
      # stylesheet the app has.
      - run: touch out/.nojekyll

      # Pages has no server-side rewrites. Next's export writes out/404.html;
      # GitHub Pages serves it for unknown paths, which is what makes deep
      # links behave rather than showing GitHub's own 404.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
