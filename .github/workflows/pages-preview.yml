# THIS IS A LIVE SITE. It builds fluolingo.com — the address students use.
#
# It began (17 Aug) as a preview at https://frenchprof.github.io/fluoduo/, and
# the header said so for seventeen days after that stopped being true. On the
# SAME COMMIT that added this workflow, a CNAME for fluolingo.com was added and
# the domain was pointed here — and a custom domain serves a Pages site at the
# DOMAIN ROOT, not at /fluoduo. The build kept emitting /fluoduo/_next/… paths
# for a site now served at /, so every stylesheet and script 404'd on
# fluolingo.com while the HTML loaded fine. Dan found it on 2 Sep; nothing in
# the repo could have, because the two halves are in two files and each looked
# right on its own.
#
# So there are TWO live sites fed from main, and this is one of them:
#   · fluolingo.com                — GitHub Pages, built HERE, root path
#   · fluolingo.withdrchan.com     — Cloudflare Pages, built from dckg/fluo,
#                                    which deploy-live.yml mirrors main into
#
# DO NOT reintroduce PAGES_BASE_PATH here. verify91 refuses it while a CNAME
# exists, which is the repo's one statement that a custom domain is in play.
#
# WHAT DOES NOT WORK ON THIS HOST, by design:
#   /api/tutor, /api/tts, /api/correct, /api/compose
# Those are Cloudflare Pages Functions — real server-side code holding the API
# key. GitHub Pages has no server, so on fluolingo.com ChaTutor, text-to-speech
# and Compose's answer-checking fail; they work on fluolingo.withdrchan.com.
# Everything else — decks, games, drills, /moi, /teacher — runs in the browser
# against Firebase and works on both.
#
# BEFORE THE FIRST RUN, one manual step (otherwise sign-in fails and /moi and
# /teacher show nothing):
#   Firebase console → Authentication → Settings → Authorised domains
#   → Add domain → fluolingo.com
name: Deploy fluolingo.com (GitHub Pages)

on:
  workflow_dispatch:          # run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# One preview at a time; a newer push supersedes an in-flight build.
concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    # The preview exists only in the WORKING repo. The same commits get
    # pushed to dckg/fluo (production, built by Cloudflare), where GitHub
    # Pages is deliberately disabled — without this guard the workflow runs
    # there too and fails with a 404 on every deploy (seen 2026-08-21).
    # `deploy` needs `build`, so skipping this skips both.
    if: github.repository == 'frenchprof/fluoduo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # AT THE ROOT, because a custom domain serves the site at the root. This
      # step used to set PAGES_BASE_PATH=/fluoduo, which was right for exactly
      # as long as the address was frenchprof.github.io/fluoduo/ — a window
      # that closed the day fluolingo.com was pointed here, in the very same
      # commit. See the header.
      - name: Build the static export
        run: npm run build

      # Without this, GitHub Pages runs Jekyll, which strips any directory
      # beginning with an underscore — including _next/, i.e. every script and
      # stylesheet the app has.
      - run: touch out/.nojekyll

      # Pages has no server-side rewrites. Next's export writes out/404.html;
      # GitHub Pages serves it for unknown paths, which is what makes deep
      # links behave rather than showing GitHub's own 404.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
