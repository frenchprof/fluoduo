# Every patch's check, on every push and every pull request.
#
# Dan, 2026-08-10: "Nothing gets reported to me as 'done' without a passing
# check to back it up, not a description."
#
# To make this a REQUIRED check (so nothing merges red), after the first run:
#
#   gh api -X POST repos/OWNER/REPO/rulesets -f name='verify' \
#     -f target=branch -f enforcement=active \
#     --input .github/ruleset-verify.json
#
# or in the browser: Settings -> Rules -> New ruleset -> Require status checks
# to pass -> add "verify". Add yourself to the bypass list: a broken CI must
# never be the reason a security fix waits.
name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Lint-changed-files diffs against the PR base, which a
          # shallow clone does not have.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # verify95-icons reads the rendered icon's pixels (is the shell red,
      # the F blue) — that needs Pillow, which the runner does not ship.
      - run: pip install --quiet pillow

      - name: Types
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # verify18 needs out/ — it walks the chunks each page actually loads.
      - name: No student PII in a learner-facing bundle
        run: python3 verify/verify18.py

      # 18b widens 18 to the whole export: no roster email or name override
      # in ANY file the CDN serves — /teacher's chunks included.
      - name: Patch 18b — no student PII anywhere on the public CDN
        run: python3 verify/verify18b.py

      - name: Patch 19 — one name per activity, gates, nav, breakpoints
        run: python3 verify/verify19.py

      - name: Patch 19b — visual pass tokens + drift ratchet
        run: python3 verify/verify19b.py

      - name: Patch 19c — HELP derives from the registry; crumb prop gone
        run: python3 verify/verify19c.py

      - name: Patch 20-21 — DrillShell phase 1 (shell, 4 routes, SioModal, legends)
        run: python3 verify/verify20.py

      - name: Cohort reset — term marker, board scope, teacher toggle
        run: python3 verify/verify21.py

      - name: Patch 22 — the lesson pager (ramp, roll, end card, one pretest runner)
        run: python3 verify/verify22.py

      # Peers' Reports tab shipped with its own check (PR #18) but no CI step —
      # wired here by the review's follow-up, per the house rule that a check
      # that CI never runs is not a check.
      - name: Teacher Reports tab — four cards, CSVs, measured float floor
        run: python3 verify/verify-reports.py

      - name: Grading unification — ONE grader, divergence table executed
        run: python3 verify/verify-grading.py

      - name: Patch 25 (hero rows) — hairline hero, actions grouped
        run: python3 verify/verify25.py

      - name: "Patch 25b — Home path: 2D/3D map, deep link, short labels, print"
        run: python3 verify/verify25b.py

      - name: Patch 25c — Home map 3D view is a real perspective scene
        run: python3 verify/verify25c.py

      - name: "Patch 23 — games: GameFrame, post-mortem → ReVue, credits once, galleries"
        run: python3 verify/verify23.py

      - name: "Patch 24 — the Index: chip rail, unit segments, result cells, hubs → redirects, ?gaps=1"
        run: python3 verify/verify24.py

      - name: Patch 26 — /moi outcome rows + heat-strip, teacher Class now + matrix, one pool fetch
        run: python3 verify/verify26.py

      - name: Loose bugs + data-truth — deck gates/empty state/tokens, /sio redirect, one weak, one shuffle, D6/D7/D9/D10/D11/D4, board identity
        run: python3 verify/verify27-bugs.py

      - name: Track D — the help ladder in DrillShell (machine + eval cases executed, every drill wired, evidence, ReVue hook, feedback function + fallback)
        run: python3 verify/verify28-trackd.py

      - name: "Rail + Menu — six families, twenty tiles (19 Aug)"
        run: python3 verify/verify29-rail.py

      - name: "Profile — one learner model at /moi + /profil (goal, next action, five rows, five-slot bar)"
