        run: python3 verify/verify80-home-postcard.py

      - name: "The origin animation ends on the NAME — FluOLinGo (1 Sep)"
        run: python3 verify/verify81-fluolingo-origin.py

      - name: "Every page wears the same chrome — spine, band, stop (1 Sep)"
        run: python3 verify/verify82-page-chrome.py

      - name: "The stop bookmark — one value, two faces, no silent writers (2 Sep)"
        run: python3 verify/verify87-stop-bookmark.py

      # Renumbered 87 -> 88 at the QC merge — fourth collision of the day:
      # both lanes claimed 87 within the hour, and the bookmark's landed first.
      - name: "First-run instructions: one per activity, none on a hub (2 Sep)"
        run: python3 verify/verify88-first-run-hints.py

      - name: "The streak bumps on every graded surface, and the bar hears it (2 Sep)"
        run: python3 verify/verify89-streak-live.py

      - name: "Every game shows the volume button, and the bar stays put (2 Sep)"
