      - name: "Banned fonts (Geist, Work Sans) — not imported, not the default, not in a stack (7 Sep)"
        run: python3 verify/verify125-banned-fonts.py

      - name: "SIO-010 keys Enchantée for Léa; Libéria carries its accent (3 Sep)"
        # Renumbered 91 -> 92 at the QC merge — sixth collision: pages-basepath
        # claimed 91 the same morning and landed first (#157).
        run: python3 verify/verify92-enchantee-liberia.py

      # The scan launches the runner's preinstalled Chrome via
