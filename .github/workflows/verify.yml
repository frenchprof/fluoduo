      - name: verify114 — level 0-4, exponential, rank-free
        run: python3 verify/verify114-level-curve.py
      - name: verify111 — the course ends, the French doesn't
        run: python3 verify/verify111-forever-french.py
      - name: verify112 — you vs last week, executed
        run: python3 verify/verify112-vs-last-week.py

      - name: "Every coloured token sits on one of the twelve palette hues (6 Sep)"
