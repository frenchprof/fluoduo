      - name: "Shared words go in the frame, not on every option; the blank is a square (1 Sep)"
        run: python3 verify/verify86-shared-affix.py

      - name: "Every check runs, and no two share a number"
        run: python3 verify/verify-wiring.py

      # Lint, scoped to the files THIS pull request touches (Dan, 29 Aug).
      #
      # `npx eslint src` reports 130 problems across 51 files. Turning that
      # on repo-wide would fail every PR on day one, which is what deleting
      # claude-review just cured. Scoped instead: new work must be clean, the
      # existing files stay until someone is in them anyway, and the pile can
      # only shrink.
      #
      # Two traps, both deliberate:
      #  - An EMPTY file list must exit, not fall through. `eslint` with no
      #    arguments lints the whole project and would fail on all 111
      #    pre-existing errors — a docs-only PR would go red.
      #  - Deleted files must be filtered out, or eslint errors on a path
      #    that is no longer there.
      - name: "Lint the files this PR touches"
        if: github.event_name == 'pull_request'
        run: |
          # No fetch here. `fetch-depth: 0` on checkout above already has the
          # full history and every ref, and `--depth=0` is not even valid —
          # git rejects it with "depth 0 is not a positive number". Swallowed
          # by `|| true`, it printed a red `fatal:` on every GREEN run, which
          # is exactly the kind of line that teaches people to ignore CI.
          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only --diff-filter=d "$BASE"...HEAD -- 'src/**/*.ts' 'src/**/*.tsx')
          if [ -z "$CHANGED" ]; then
            echo "No source files touched — nothing to lint."
            exit 0
          fi
          echo "Linting $(echo "$CHANGED" | wc -l) changed file(s):"
          echo "$CHANGED"
          npx eslint $CHANGED

      - name: The band a learner sees and the evidence we store agree
        run: python3 verify/verify62-band-evidence.py

      - name: The rail's tiers step down on the coloured edge
        run: python3 verify/verify61-flap-edge.py

      - name: The Mémo's French forms are its bold heroes
        run: python3 verify/verify65-memo-forms.py

      - name: The concept's answer and decision tree stay collapsed
        run: python3 verify/verify67-concept-length.py

      - name: A word may not butt against the next across an element edge
        run: python3 verify/verify72-jsx-spacing.py

      # The browser half of verify72, LAST on purpose: it replaces out/ with
      # an OPEN export, and the wall build above is the one verify18/18b
      # audit — nothing may read out/ after this line expecting the wall.
