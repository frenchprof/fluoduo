# Every patch's check, on every push and every pull request.
#
# Dan, 2026-08-10: "Nothing gets reported to me as 'done' without a passing
# check to back it up, not a description."
#
# To make this a REQUIRED check (so nothing merges red), after the first run:
#
#   gh api -X POST repos/OWNER/REPO/rulesets -f name='verify' \
#     -f target=branch -f enforcement=active \
#     --input .github/ruleset-verify.json
#
# or in the browser: Settings -> Rules -> New ruleset -> Require status checks
# to pass -> add "verify". Add yourself to the bypass list: a broken CI must
# never be the reason a security fix waits.
name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ONE RUN PER BRANCH — a newer push supersedes the one still going (11 Sep).
#
# WHY, WITH THE ARITHMETIC. This repo is PRIVATE, so every Actions minute is
# metered against the account's monthly allowance, and this workflow is the
# expensive one: 129 checks, ~10½ minutes a run, where it was under two
# minutes on 1 September. Measured over 11 days: ~405 runs, and 59 of them
# between 02:32 and 10:25 on the 11th alone — about seven hours of runner time
# in one morning. The allowance ran out mid-morning and every run, on every
# branch INCLUDING main, then died in 2-5 seconds with no logs. Nothing could
# merge and `deploy-live` could not fire, because it refuses any commit whose
# verify check is not green.
#
# Three things compound: the suite keeps growing, several lanes push at once,
# and — until this block — nothing cancelled a superseded run. Five pushes to
# one branch in an afternoon meant five full runs, four of them measuring a
# commit nobody would look at again. That last one is the only one a config
# can fix, so it is fixed here.
#
# MAIN IS EXEMPT, AND THAT IS THE LOAD-BEARING HALF. `deploy-live` reads the
# `verify` check's conclusion for the commit it is about to mirror. A
# CANCELLED run is not a green one, so cancelling a run on main would leave
# that commit permanently undeployable — the workflow would refuse it forever
# and the only way out would be another commit. Pushes to main therefore QUEUE
# rather than cancel; they are merges, so they are rare, and a few minutes of
# queue is not worth a commit that can never ship.
#
# `github.ref` is `refs/pull/<n>/merge` on a pull_request event, so each PR is
# its own group, and `refs/heads/main` on a push, which is the one we spare.
# The workflow name is in the group because concurrency groups are
# repository-wide: `pages-preview.yml` has its own and the two must not meet.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Lint-changed-files diffs against the PR base, which a
          # shallow clone does not have.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # verify95-icons reads the rendered icon's pixels (is the shell red,
      # the F blue) — that needs Pillow, which the runner does not ship.
      - run: pip install --quiet pillow

      - name: Types
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # verify18 needs out/ — it walks the chunks each page actually loads.
      - name: No student PII in a learner-facing bundle
        run: python3 verify/verify18.py

      # 18b widens 18 to the whole export: no roster email or name override
