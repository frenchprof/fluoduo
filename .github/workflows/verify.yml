      - name: patch 45 — deck promises (SIO-001 M./Mme, SIO-005 mnemonics)
        run: python3 verify/verify45-promise-gaps.py

      - name: "SIO-005 and SIO-006 have a lesson; the colour ladder, the band weight, the English tabs (31 Aug)"
        run: python3 verify/verify68-two-tier2-stops.py

      - name: "The drill's ✕ has one home, and the 56px row is only drawn when it carries something (31 Aug)"
        run: python3 verify/verify73-drill-chrome.py

      - name: "SIO-038 has a lesson; its twelve sentences are the deck's own and ★ withdraws the frame (1 Sep)"
        run: python3 verify/verify74-transport-stop.py

      - name: "An atelier's lesson adds the register and does not eat the model (1 Sep)"
        run: python3 verify/verify75-atelier-lesson.py

      # Renumbered 76 -> 83 at merge: Peers' branch minted a second verify76
      # while verify76-envies-besoins was landing — the in-flight collision the
      # AGENTS.md sweep exists to catch, found by Pre-tests mid-flight.
      - name: "SIO-025 has a lesson; ★ withdraws the frame (1 Sep)"
        run: python3 verify/verify83-parce-que.py

      - name: "The five remaining ateliers: the model survives, and no option Dan did not review (1 Sep)"
        run: python3 verify/verify77-five-ateliers.py

      # Renumbered 82 -> 84 at merge: the SECOND live verify-number collision
      # of the evening (Peers minted 82 while Pre-tests' verify82-page-chrome
      # was merging in #131). The remote sweep only helps if run at minting.
      - name: "The atelier model's English is toggled, on by default, never deleted (1 Sep)"
        run: python3 verify/verify84-atelier-english.py

      # Minted as 83, renumbered to 85 on rebase: 83 had gone to
      # verify83-parce-que in the same merge that moved this branch's 82 to 84.
      # Third number collision of the day; the sweep was run at minting and
      # still lost, because both numbers were claimed after it.
