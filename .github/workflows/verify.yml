      - name: "The site bar outranks page content, so ☰ stays tappable (5 Sep)"
        run: python3 verify/verify94-topbar-above-page.py

      - name: "FluOLinGo wears its own mark, not the starter's (5 Sep)"
        run: python3 verify/verify95-icons.py

      - name: "The map's stops are objects; numbers stay; the embed is clean (6 Sep)"
        run: python3 verify/verify108-map-depth.py

      - name: "No French on a control a beginner must read to act (6 Sep)"
